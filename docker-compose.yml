services:
  karaver:
    image: ghcr.io/zoosewu/karaver:${KARAVER_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      FILENAME_FORMAT: ${FILENAME_FORMAT:-}
      FILENAME_SEPARATOR: ${FILENAME_SEPARATOR:-}
      ORIGINAL_SUFFIX: ${ORIGINAL_SUFFIX:-}
      MEDIA_EXTENSIONS: ${MEDIA_EXTENSIONS:-}
      GOMEMLIMIT: 64MiB
    volumes:
      - karaver-data:/data
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media:ro

volumes:
  karaver-data:
