name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go vet & test
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend check & build
        working-directory: web
        run: |
          npm ci
          npx svelte-check --tsconfig ./tsconfig.app.json
          npm run build

  # Builds the real image, runs it against a generated song library and drives
  # it with Google Chrome (H.264 playback): phone page, TV pairing, player, admin.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test song library
        run: e2e/make-media.sh

      - name: Start zKaraver
        run: |
          cat > .env <<'EOF'
          PUBLIC_URL=http://localhost:8088
          ADMIN_PASSWORD=test-pass
          MEDIA_PATH=./e2e/media
          PORT=8088
          ORIGINAL_SUFFIX=_original
          EOF
          docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build --wait

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          google-chrome --version || npx playwright install --with-deps chrome

      - name: Run end-to-end tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8088
        run: npx playwright test

      - name: Server logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml logs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  image:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The default image installs ffmpeg with apt, which runs as the target arch.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> latest + sha-xxxxxxx; tag v1.2.3 -> 1.2.3, 1.2, 1; PRs build only.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      # Default image: with ffmpeg + Rubber Band (key change).
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # "slim": Alpine without key change. main -> slim; v1.2.3 -> 1.2.3-slim, 1.2-slim, 1-slim.
      - id: meta-slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=slim,enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=-slim
            type=semver,pattern={{major}}.{{minor}},suffix=-slim
            type=semver,pattern={{major}},suffix=-slim
            type=sha,suffix=-slim

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
